name: build
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-13, label: macos-intel}
          - {os: macos-14, label: macos-arm}
          - {os: windows-latest, label: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (real-media and env-gated tests skip themselves)
        run: python -m pytest -q tests
      - name: Build
        run: python -m PyInstaller --noconfirm amv_matcher.spec
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: "dist/AMV\\ Matcher.app/Contents/MacOS/AMV\\ Matcher --selftest"
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist\AMV Matcher\AMV Matcher.exe" --selftest'
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/AMV Matcher.app" "AMV-Matcher-${{ matrix.label }}.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\AMV Matcher" -DestinationPath "AMV-Matcher-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AMV-Matcher-${{ matrix.label }}
          path: AMV-Matcher-${{ matrix.label }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AMV-Matcher-${{ matrix.label }}.zip
