name: build
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'THIRD-PARTY-NOTICES*'
      - 'LICENSE*'
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly: macOS legs only (push/PR builds are Windows-only)
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which targets to build (and release, if a tag is given)'
        type: choice
        options: [windows, macos, all]
        default: windows
      tag:
        description: 'Existing v* tag to build and publish as a GitHub Release (empty = plain build, no release)'
        required: false
        default: ''
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Windows is the primary target: push, PR and tag builds run Windows only.
  # macOS runs nightly (schedule) and on manual dispatch with platforms=macos|all.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      labels: ${{ steps.p.outputs.labels }}
    steps:
      - id: p
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PLAT: ${{ inputs.platforms }}
        run: |
          case "$EVENT" in
            schedule) P=macos ;;
            workflow_dispatch) P="${PLAT:-windows}" ;;
            *) P=windows ;;
          esac
          WIN='{"os":"windows-latest","label":"windows"}'
          ARM='{"os":"macos-15","label":"macos-arm"}'
          INTEL='{"os":"macos-15-intel","label":"macos-intel"}'
          case "$P" in
            windows) M="$WIN"; L="windows" ;;
            macos) M="$ARM,$INTEL"; L="macos-arm macos-intel" ;;
            all) M="$WIN,$ARM,$INTEL"; L="windows macos-arm macos-intel" ;;
            *) echo "bad platforms: $P"; exit 1 ;;
          esac
          echo "matrix={\"include\":[$M]}" >> "$GITHUB_OUTPUT"
          echo "labels=$L" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install (macOS, pinned by constraints-macos.txt)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints-macos.txt
      - name: Install (Windows, unconstrained; see docs/ci-constraints-proposal.md)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (real-media and env-gated tests skip themselves)
        run: python -m pytest -q tests
      - name: Build
        run: python -m PyInstaller --noconfirm amv_matcher.spec
      - name: Selftest (macOS)   # scan (+12-song scan), auto-sync, 1 s dup render, stems quick split, Resolve export, RIFE path
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          "dist/AMV Matcher.app/Contents/MacOS/AMV Matcher" --selftest --selftest-log selftest.log
          test "$(grep -c '^selftest ok' selftest.log)" -eq 9
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $p = Start-Process -FilePath "dist\AMV Matcher\AMV Matcher.exe" -ArgumentList "--selftest","--selftest-log","selftest.log" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          $n = (Select-String -Path selftest.log -Pattern '^selftest ok').Count
          if ($n -ne 9) { throw "expected 9 selftest ok lines, got $n" }
      - name: Scan timing, serial vs default scoring (Windows, informational; synthetic media)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 25
        run: |
          $w = Join-Path $env:RUNNER_TEMP "amv-scan-timing"
          $out = python -I tools\scan_timing.py --exe "dist\AMV Matcher\AMV Matcher.exe" -n 10 --seconds 180 --work $w
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          foreach ($l in ($out | Where-Object { $_ -match '^scan_timing_detail ' })) {
            $cfg = ($l -split ' ')[1]
            $f = @{}; [regex]::Matches($l, '(\w+)=([\d.]+)') | ForEach-Object { $f[$_.Groups[1].Value] = $_.Groups[2].Value }
            $ok = if ([double]$f['cold_first'] -lt 5) { 'meets' } else { 'misses' }
            Write-Host "scan_timing_summary $cfg : first ranked row cold $($f['cold_first']) s ($ok the 5 s target), warm $($f['warm_first']) s; whole scan cold $($f['cold_wall']) s, warm $($f['warm_wall']) s; N=$($f['n']) synthetic songs of 180 s (3 min) each + one 60 s video"
          }
          Write-Host "scan_timing exit code $code"
          if ($code -ne 0) { throw "scan_timing exit code $code" }
      - name: Dark-mode screenshots (Windows, CI-only check; synthetic media loaded via the native-drop hand-off)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 10
        run: |
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v AppsUseLightTheme /t REG_DWORD /d 0 /f
          $m = Join-Path $env:RUNNER_TEMP "amv-dark-media"; New-Item -ItemType Directory -Force $m | Out-Null
          python -I -c "import av,numpy as np,soundfile as sf,sys; o=av.open(sys.argv[1]+'/v.mp4','w'); s=o.add_stream('libx264',rate=24); s.width,s.height,s.pix_fmt=320,240,'yuv420p'; [o.mux(p) for i in range(144) for p in s.encode(av.VideoFrame.from_ndarray(np.full((240,320,3),255 if (i//12)%2==0 else 20,np.uint8),format='rgb24'))]; [o.mux(p) for p in s.encode(None)]; o.close(); y=np.zeros(22050*20,np.float32); [y.__setitem__(slice(int(k*.5*22050),int(k*.5*22050)+400),np.hanning(400)*.9) for k in range(40)]; sf.write(sys.argv[1]+'/click.wav',y,22050)" $m
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public struct RECT{public int L,T,R,B;}public static class W{[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out RECT r);}'
          # Hosted runner screens are 1024x768 and cannot be resized, so one 1000x700 window, captured by its own bounds.
          $env:AMV_WINDOW_SIZE = "1000x700"
          $env:AMV_DATA_DIR = Join-Path $env:RUNNER_TEMP "amv-dark-data"
          $env:AMV_TEST_DROP = "$m\v.mp4;$m\click.wav"
          $env:AMV_TEST_OPEN_MENU = "1"
          $env:AMV_ACCESS_LOG = "1"
          $env:AMV_TEST_DOMDROP = "1"
          $log = Join-Path $env:AMV_DATA_DIR "app.log"
          $app = Start-Process -FilePath "dist\AMV Matcher\AMV Matcher.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'windark: open_menu' -Quiet))) { Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 3
          $app.Refresh()
          $r = New-Object RECT
          [void][W]::GetWindowRect($app.MainWindowHandle, [ref]$r)
          $w = $r.R - $r.L; $h = $r.B - $r.T
          if ($w -lt 200 -or $h -lt 200) { $v = [System.Windows.Forms.SystemInformation]::VirtualScreen; $r.L = $v.X; $r.T = $v.Y; $w = $v.Width; $h = $v.Height }
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, (New-Object System.Drawing.Size $w, $h))
          $bmp.Save("windows-dark-1000x700.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path $log) { Copy-Item $log "windows-dark-app.log"; Select-String -Path $log -Pattern 'windark|test drop|test probe|test domdrop|native drop|js:|HTTP/1.1|ui:' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) } }
          else { throw "no app.log at $log" }
          if (-not (Select-String -Path $log -Pattern 'windark: menu recolour ok dark=True' -Quiet)) { throw "menu recolour did not report ok" }
          if (Select-String -Path $log -Pattern 'FAILED' -Quiet) { throw "windark logged a FAILED line" }
          if (-not (Select-String -Path $log -Pattern 'test probe: .*hooks_visible=True' -Quiet)) { throw "V1 legend / A1 toggle / fullscreen button not all visible" }
      - name: Upload dark-mode screenshot
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dark-screenshot
          path: |
            windows-dark-*.png
            windows-dark-app.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Package encrypted (macOS/Windows)
        shell: bash
        env:
          AMV_ARTIFACT_KEY: ${{ secrets.AMV_ARTIFACT_KEY }}
        run: |
          if [ -z "$AMV_ARTIFACT_KEY" ]; then
            echo "AMV_ARTIFACT_KEY not set: no binary artifact uploaded"
            exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            command -v 7zz >/dev/null || command -v 7z >/dev/null || brew install sevenzip
            SZ=$(command -v 7zz || command -v 7z)
            SRC="dist/AMV Matcher.app"
          else
            SZ=$(command -v 7z || echo "/c/Program Files/7-Zip/7z.exe")
            SRC="dist/AMV Matcher"
          fi
          mkdir -p enc
          OUT="enc/AMV-Matcher-${{ matrix.label }}.7z"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto keeps bundle symlinks, exec bits, xattrs; zip lives outside enc/
            TMPZIP="${RUNNER_TEMP}/AMV-Matcher-${{ matrix.label }}.zip"
            trap 'rm -f "$TMPZIP"' EXIT
            ditto -c -k --sequesterRsrc --keepParent "$SRC" "$TMPZIP"
            "$SZ" a -t7z -mhe=on -p"$AMV_ARTIFACT_KEY" "$OUT" "$TMPZIP" > /dev/null
          else
            "$SZ" a -t7z -mhe=on -p"$AMV_ARTIFACT_KEY" "$OUT" "$SRC" > /dev/null
          fi
          echo "encrypted archive written"
      - name: Upload encrypted build
        uses: actions/upload-artifact@v4
        with:
          name: AMV-Matcher-${{ matrix.label }}-encrypted
          path: enc/*.7z
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload selftest log (text only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log-${{ matrix.label }}
          path: selftest.log
          retention-days: 7
          if-no-files-found: ignore

  # Encrypted GitHub Release: only after every selected leg (tests, build, selftests, encrypted packaging) is green.
  # Windows-only by default; macOS assets are included only when platforms includes them (never from a tag push or the nightly).
  release:
    needs: [plan, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: AMV-Matcher-*-encrypted
          path: in
      - name: Verify encrypted archives and publish the release
        shell: bash
        env:
          AMV_ARTIFACT_KEY: ${{ secrets.AMV_ARTIFACT_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          LABELS: ${{ needs.plan.outputs.labels }}
        run: |
          set -eu +x
          TAG="${TAG_INPUT:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "bad tag name: $TAG"; exit 1
          fi
          VER="${TAG#v}"
          if [ -z "$AMV_ARTIFACT_KEY" ]; then
            echo "AMV_ARTIFACT_KEY not set: refusing to release (would have no encrypted assets)"; exit 1
          fi
          command -v 7zz >/dev/null || command -v 7z >/dev/null || sudo apt-get install -y p7zip-full >/dev/null
          SZ=$(command -v 7zz || command -v 7z)
          mkdir -p out
          N=0
          for L in $LABELS; do
            SRC="in/AMV-Matcher-${L}-encrypted/AMV-Matcher-${L}.7z"
            DST="out/AMV-Matcher-${VER}-${L}.7z"
            [ -f "$SRC" ] || { echo "missing encrypted archive for $L"; exit 1; }
            # 1) 7z signature
            [ "$(head -c 6 "$SRC" | od -An -tx1 | tr -d ' \n')" = "377abcaf271c" ] || { echo "$L: not a 7z"; exit 1; }
            # 2) headers encrypted: listing without a password must fail
            if "$SZ" l -slt "$SRC" </dev/null >/dev/null 2>&1; then
              echo "$L: archive lists WITHOUT a password (headers not encrypted)"; exit 1
            fi
            # 3) with the key every entry must read Encrypted = +
            "$SZ" l -slt -p"$AMV_ARTIFACT_KEY" "$SRC" > "list-$L.txt" 2>/dev/null || { echo "$L: cannot list with the key"; exit 1; }
            grep -q '^Encrypted = +' "list-$L.txt" || { echo "$L: no encrypted entries"; exit 1; }
            # directories and empty files carry no data, so 7z lists them as Encrypted = -; every entry with data must be +
            BAD="$(awk 'BEGIN{RS="";FS="\n"} /\nFolder = -/ { f=0; e=""; s=0; for(i=1;i<=NF;i++){ if($i=="Encrypted = -")e="-"; if($i ~ /^Size = /){split($i,a," = "); s=a[2]+0} } if(e=="-" && s>0) n++ } END{print n+0}' "list-$L.txt")"
            if [ "$BAD" != "0" ]; then echo "$L: $BAD unencrypted file entries present"; exit 1; fi
            cp "$SRC" "$DST"
            N=$((N+1))
            echo "$L: 7z, encrypted headers and entries OK"
          done
          rm -f list-*.txt
          [ "$N" -ge 1 ] && [ "$(ls out | wc -l | tr -d ' ')" = "$N" ] || { echo "unexpected asset set"; exit 1; }
          (cd out && sha256sum AMV-Matcher-*.7z > SHA256SUMS.txt)
          # notes: commit subjects since the previous tag + fixed install block
          EXC=""
          case "$TAG" in *-*) ;; *) EXC="--exclude=v*-*" ;; esac   # a final tag is compared with the previous final tag, not an rc
          PREV=$(git describe --tags --abbrev=0 --match 'v*' $EXC "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$PREV" ]; then git log --no-merges --format='- %s' "${PREV}..${TAG}"; else git log --no-merges --format='- %s' "${TAG}"; fi
            echo
            echo "## How to install"
            echo "1. Download the archive for your system (\`$LABELS\`), plus \`SHA256SUMS.txt\` to check it."
            echo "2. The archive is encrypted (AES-256, file names hidden). Open it with [7-Zip](https://www.7-zip.org/) (macOS: \`7zz\` or Keka); the password is the owner's key."
            case " $LABELS " in *" windows "*) echo "3. Windows: the extracted folder runs as is. SmartScreen may warn on first launch: More info > Run anyway." ;; esac
            case "$LABELS" in *macos*) echo "4. macOS: the 7z holds a zip made with \`ditto\`; extract it with \`ditto -x -k <file>.zip <dest>\` or Archive Utility. First launch: right-click the app > Open." ;; esac
            echo
            echo "Personal-use build: the bundled FFmpeg includes GPL components; see THIRD-PARTY-NOTICES.md."
          } > notes.md
          MAJOR="${VER%%.*}"
          PRE=""
          if [ "$MAJOR" -lt 1 ]; then PRE="--prerelease"; fi
          gh release create "$TAG" out/AMV-Matcher-*.7z out/SHA256SUMS.txt --verify-tag --title "AMV Matcher $VER" --notes-file notes.md $PRE
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url,isPrerelease,assets:[.assets[]|{name,size}]}'
