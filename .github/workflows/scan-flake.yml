name: scan-flake
# Manual only. Repeats the frozen-app scan_timing (fresh data dir = fresh numba cache, fresh app process each round)
# on one or two commits to tell a flaky Windows crash from a fixed one. Synthetic media only; nothing is released.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Rounds per commit'
        default: '5'
      ref_a:
        description: 'Commit A (the build under test)'
        required: true
        default: 'd3696f6'
      ref_b:
        description: 'Commit B (lock-less control; empty = skip)'
        required: false
        default: '922682a'
      hd_seconds:
        description: 'Seconds of the 1080p60 H.264 test video'
        default: '120'
concurrency:
  group: scan-flake-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  flake:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.ref_b != '' && format('["{0}","{1}"]', inputs.ref_a, inputs.ref_b) || format('["{0}"]', inputs.ref_a)) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build
        run: python -m PyInstaller --noconfirm amv_matcher.spec
      - name: Cache synthetic fixtures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/amv-flake/fixtures
          key: flake-fixtures-v1-${{ inputs.hd_seconds }}-${{ hashFiles('tools/scan_timing.py') }}
      - name: "Rounds (each round: fresh data dir and fresh app process; fixtures reused)"
        shell: pwsh
        timeout-minutes: 40
        env:
          ROUNDS: ${{ inputs.rounds }}
          HD: ${{ inputs.hd_seconds }}
          REF: ${{ matrix.ref }}
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP "amv-flake-dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\AMV Matcher.exe"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          $w = Join-Path $env:RUNNER_TEMP "amv-flake"
          $crashes = 0
          for ($i = 1; $i -le [int]$env:ROUNDS; $i++) {
            $o = python -I tools\scan_timing.py --exe "dist\AMV Matcher\AMV Matcher.exe" -n 5 --seconds 180 --hd-video $env:HD --only default --work $w
            $c = $LASTEXITCODE
            $o | ForEach-Object { Write-Host "[round $i] $_" }
            $d = ($o | Where-Object { $_ -match '^scan_timing_detail ' } | Select-Object -First 1)
            $f = @{}
            if ($d) { [regex]::Matches($d, '(\w+)=([\d.]+)') | ForEach-Object { $f[$_.Groups[1].Value] = $_.Groups[2].Value } }
            if ($c -ne 0) { $crashes++ }
            Write-Host "flake_round ref=$env:REF round=$i exit=$c cold_wall=$($f['cold_wall']) cold_video_stage=$($f['cold_video']) cold_first_row=$($f['cold_first']) warm_first_row=$($f['warm_first'])"
          }
          Write-Host "flake_total ref=$env:REF rounds=$env:ROUNDS crashes=$crashes"
          if ($crashes -gt 0) { throw "$crashes of $env:ROUNDS rounds failed on $env:REF" }
      - name: Upload logs and dumps
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-flake-${{ matrix.ref }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/amv-flake/**/app.log
            ${{ runner.temp }}/amv-flake/stdout-*.txt
            ${{ runner.temp }}/amv-flake-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 7
